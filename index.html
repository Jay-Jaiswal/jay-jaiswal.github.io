          detailedOverview: `

          github: "https://github.com/Jay-Jaiswal/SnackIt",
        },
        {
          id: 9,
          title: "Suruchi",
          categories: ["Web App"],
          tags: ["TypeScript", "Web App"],
          desc: "A high-performance TypeScript project handling advanced frontend templating and functionality.",
          detailedOverview: `
                <p><strong>Overview:</strong> A high-performance TypeScript project handling advanced frontend templating and functionality.</p>
                <div class="mt-6 p-4 bg-gray-100 border-l-4 border-black">
                    <p class="mb-4">Suruchi showcases advanced frontend engineering using TypeScript. It is a high-performance web application designed with modular templating and state-of-the-art UI functionality.</p>
                    <p class="font-bold">Key Technical Details:</p>
                    <ul class="list-disc pl-5 mt-2 marker:text-black">
                        <li>Advanced TypeScript and Web App architecture</li>
                        <li>Emphasizes clean code architecture, smooth state management, and highly interactive user components.</li>

          `,
          github: "https://github.com/Jay-Jaiswal/Suruchi",

      ];

      const activeProjects = window.CATALOGUE_PROJECTS || projects;

      let currentFilter = "All";
      let searchQuery = "";
      const filterContainer = document.getElementById("filter-container");
      const projectGrid = document.getElementById("project-grid");
      const searchInput = document.getElementById("search");

      // Setup Search Listener
      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value.toLowerCase();
        renderProjects();
      });

      // Setup Keyboard Navigation for Filters
      filterContainer.addEventListener("keydown", (e) => {
        const buttons = Array.from(filterContainer.querySelectorAll("button"));
        const index = buttons.indexOf(document.activeElement);
        if (e.key === "ArrowRight" || e.key === "ArrowDown") {
          e.preventDefault();
          const next = (index + 1) % buttons.length;
          buttons[next].focus();
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
          e.preventDefault();
          const prev = (index - 1 + buttons.length) % buttons.length;
          buttons[prev].focus();
        }
      });

      // Console Log Easter Egg
      console.log(
        "%c HIRED! %c\n\nLooking for a developer who ships?\nEmail me: jaiswaljay010@gmail.com\n\n",
        "font-size: 40px; font-weight: 900; color: white; background: black; border: 4px solid white; padding: 10px;",
        "font-size: 16px; font-family: monospace;",
      );

      // Modal Logic
      const projectModal = document.getElementById("project-modal");
      const modalTitle = document.getElementById("modal-title");
      const modalTags = document.getElementById("modal-tags");
      const modalContent = document.getElementById("modal-content");
      const modalGithub = document.getElementById("modal-github");

      // Close on clicking outside the modal content
      projectModal.addEventListener("click", (e) => {
        if (e.target === projectModal) closeModal();
      });

      // Close on Escape key
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !projectModal.classList.contains("hidden")) {
          closeModal();
        }
      });

      function openModal(id) {
        const proj = activeProjects.find((p) => p.id === id);
        if (!proj) return;

        modalTitle.textContent = proj.title;

        modalTags.innerHTML = proj.tags
          .map(
            (tag) =>
              `<span class="inline-block bg-black text-white text-xs font-bold px-2 py-1 border-2 border-black uppercase tracking-wider">${tag}</span>`,
          )
          .join("");

        modalContent.innerHTML =
          '<p class="text-center font-bold">Loading README...</p>';
        modalGithub.href = proj.github;

        // Fetch README from GitHub
        const repoName = proj.github.split("/").pop();
        const rawUrlMain = `https://raw.githubusercontent.com/Jay-Jaiswal/${repoName}/main/README.md`;
        const rawUrlMaster = `https://raw.githubusercontent.com/Jay-Jaiswal/${repoName}/master/README.md`;

        async function fetchReadme() {
          try {
            let response = await fetch(rawUrlMain);
            if (!response.ok) {
              response = await fetch(rawUrlMaster);
            }
            if (response.ok) {
              const text = await response.text();
              modalContent.innerHTML = marked.parse(text);

              // Apply Tailwind prose/brutalist styles to markdown elements
              const headers = modalContent.querySelectorAll(
                "h1, h2, h3, h4, h5, h6",
              );
              headers.forEach((h) =>
                h.classList.add("font-black", "mt-6", "mb-4"),
              );

              const links = modalContent.querySelectorAll("a");
              links.forEach((l) =>
                l.classList.add(
                  "underline",
                  "hover:text-gray-600",
                  "font-bold",
                ),
              );

              const lists = modalContent.querySelectorAll("ul, ol");
              lists.forEach((l) =>
                l.classList.add("pl-5", "list-disc", "mb-4"),
              );

              const codeBlocks = modalContent.querySelectorAll("pre");
              codeBlocks.forEach((cb) =>
                cb.classList.add(
                  "bg-gray-100",
                  "p-4",
                  "border-2",
                  "border-black",
                  "overflow-x-auto",
                  "mb-4",
                ),
              );

              const inlineCodes =
                modalContent.querySelectorAll("code:not(pre code)");
              inlineCodes.forEach((c) =>
                c.classList.add(
                  "bg-gray-200",
                  "px-1",
                  "rounded",
                  "text-black",
                  "font-mono",
                  "border",
                  "border-gray-400",
                ),
              );
            } else {
              // Fallback to detailed Overview if no README exists
              modalContent.innerHTML = proj.detailedOverview;
            }
          } catch (e) {
            // Fallback on network error
            modalContent.innerHTML = proj.detailedOverview;
          }
        }
        fetchReadme();

        projectModal.classList.remove("hidden");
        projectModal.classList.add("flex");
        document.body.style.overflow = "hidden"; // Prevent background scrolling
      }

      function closeModal() {
        projectModal.classList.add("hidden");
        projectModal.classList.remove("flex");
        document.body.style.overflow = "";
      }

      // Render the pill-shaped filter buttons
      function renderFilters() {
        filterContainer.innerHTML = "";
        activeFilters.forEach((filter, index) => {
          const btn = document.createElement("button");
          btn.textContent = filter;
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", currentFilter === filter);
          btn.tabIndex = currentFilter === filter ? 0 : -1;

          const isActive = currentFilter === filter;

          // Brutalist pill styling
          btn.className =
            `px-5 py-2 rounded-full font-bold border-2 border-black transition-colors text-sm uppercase tracking-wide focus:outline-none focus:ring-4 focus:ring-gray-300 ` +
            `${isActive ? "bg-black text-white" : "bg-white text-black hover:bg-gray-200"}`;

          btn.onclick = () => {
            currentFilter = filter;
            renderFilters(); // Re-render to update active state
            renderProjects(); // Update grid

            // Focus back on the active button after re-render so keyboard nav isn't lost
            const newActive = filterContainer.querySelector(
              `button[aria-selected="true"]`,
            );
            if (newActive) newActive.focus();
          };
          filterContainer.appendChild(btn);
        });
      }

      // Render the responsive project card grid
      function renderProjects() {
        projectGrid.innerHTML = "";

        // Filter logic (Category + Search)
        let filteredProjects =
          currentFilter === "All"
            ? activeProjects
            : activeProjects.filter((p) =>
                p.categories.includes(currentFilter),
              );

        if (searchQuery) {
          filteredProjects = filteredProjects.filter(
            (p) =>
              p.title.toLowerCase().includes(searchQuery) ||
              p.desc.toLowerCase().includes(searchQuery) ||
              p.tags.some((t) => t.toLowerCase().includes(searchQuery)),
          );
        }

        if (filteredProjects.length === 0) {
          projectGrid.innerHTML = `<p class="text-gray-500 font-bold col-span-full py-10 text-center">No projects found matching your criteria.</p>`;
          return;
        }

        // Generate HTML for each card
        filteredProjects.forEach((proj) => {
          // UI tags
          const tagsHtml = proj.tags
            .map(
              (tag) =>
                `<span class="inline-block bg-white text-black text-xs font-bold px-2 py-1 mr-2 mb-2 border-2 border-black uppercase tracking-wider">${tag}</span>`,
            )
            .join("");

          // Only render Live Demo button if proj.demo exists (currently none have it, to add it just add demo: "url" to the data object)
          const liveDemoHtml = proj.demo
            ? `<a href="${proj.demo}" target="_blank" onclick="event.stopPropagation()" class="flex-1 text-center bg-black text-white border-2 border-black font-bold py-2 text-sm hover:bg-transparent hover:text-black transition-colors uppercase tracking-wide dark:hover:text-white">Live Demo</a>`
            : ``;

          const cardHTML = `
                    <div onclick="openModal(${proj.id})" class="brutal-border bg-white p-4 flex flex-col h-full brutal-shadow brutal-shadow-hover transition-all duration-200 group cursor-pointer">
                        <!-- Image Placeholder (Aspect Video) -->
                        <div class="w-full aspect-video bg-gray-100 border-2 border-black mb-5 flex items-center justify-center overflow-hidden relative group-hover:bg-gray-200 transition-colors">
                            <span class="text-gray-400 font-black tracking-widest text-xs uppercase diagonal-stripes">Read More</span>
                        </div>
                        
                        <!-- Details -->
                        <h3 class="text-2xl font-black mb-2 tracking-tight">${proj.title}</h3>
                        <p class="text-gray-800 text-sm mb-5 flex-grow font-medium leading-relaxed border-l-4 border-black pl-3">${proj.desc}</p>
                        
                        <!-- Tags Container -->
                        <div class="mb-6">
                            ${tagsHtml}
                        </div>
                        
                        <!-- Minimum Buttons -->
                        <div class="flex gap-3 mt-auto pt-4 border-t-2 border-black">
                            ${liveDemoHtml}
                            <a href="${proj.github}" target="_blank" onclick="event.stopPropagation()" class="flex-1 text-center bg-white text-black border-2 border-black font-bold py-2 text-sm hover:bg-black hover:text-white transition-colors uppercase tracking-wide">GitHub Repo</a>
                        </div>
                    </div>
                `;
          projectGrid.insertAdjacentHTML("beforeend", cardHTML);
        });
      }

      // Initialize App
      renderFilters();
      renderProjects();
    </script>
  </body>
</html>
